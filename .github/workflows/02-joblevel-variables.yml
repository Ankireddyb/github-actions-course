name: 02-job-level-variables
on:
    workflow_dispatch: 
jobs:
    dev-job:
        runs-on: ubuntu-latest
        env:
            ENVIRONMENT: "dev"
            APP_NAME: jasmika-dev-app
        steps: 
         - name: Print Variables
           run: |
            echo "Printing Environmental Variables"
            echo "Application Name is ::: $APP_NAME"
            echo "Environment is :: $ENVIRONMENT"
    pro-job:
        runs-on: ubuntu-latest
        env:
            APP_NAME: jasmika-prod-app
            ENVIRONMENT: prod
        steps:
         - name: Print Variables
           run: |
            echo "Printing Environmental Variables "
            echo "Application Name is :: $APP_NAME"
            echo "Environment is ::: $ENVIRONMENT"
    
              
    