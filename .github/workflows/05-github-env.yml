name: 05-github-env
on:
    workflow_dispatch:
jobs: 
  github-env-variables:
    runs-on: ubuntu-latest
    steps:
        - name: Set variables 
          run: |
           echo "APP_VERSION=1.0.0" >>$GITHUB_ENV
           echo "NAME=Anki" >>$GITHUB_ENV
           echo "Trying to print APP_VERSION and NAME in the same step "
           echo "Application version is $APPLICATION_NAME"
           echo "Name is $NAME"
        - name: Print variables
          run: |
           echo "Trying to print APP_VERSION and NAME in the next step "
           echo "Application version is $APP_VERSION"
           echo "Name is $NAME"