name: 08-3-job-output
on:
 workflow_dispatch:
jobs:
    prepare-job:
        name: prepare
        runs-on: ubuntu-latest
        outputs:
            image-tag: ${{steps.tag.outputs.value}}
            app-name: ${{steps.app.outputs.value}}
        steps:
            - name: Generate Image Tag
              id: tag
              run: |
               echo "value=${{github.sha}}" >> $GITHUB_OUTPUT
            - name: Set App Name
              id: app
              run: |
               echo "value=i27academy-devops-dashboard" >> $GITHUB_OUTPUT

    build-job:
        name: Build
        runs-on: ubuntu-latest
        needs: prepare-job
        steps:
            - name: Read outputs from Prepare Job
              run: |
               echo "My App Name is : ${{needs.prepare-job.outputs.app-name}}"
               echo "Image Tag Name is : ${{needs.prepare-job.outputs.image-tag}}"


        